name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - name: Verify the vendored Omarchy validator
        working-directory: scripts/vendor/omarchy
        run: sha256sum --check SHA256SUMS
      - name: Validate the manifest with Omarchy's validator
        run: bash scripts/vendor/omarchy/omarchy-plugin-validate .
      - name: Run the plugin security checks
        run: scripts/validate-plugin.sh .
      - run: python3 -I -m unittest discover -s tests
      - run: node tests/model.test.js
